<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜數字遊戲</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg, linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%));
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            padding: 20px;

            --card-scale: 1;
            --font-scale: 1;
        }
        .game-card {
            position: relative;
            background: #1a1a2e;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            transform: scale(var(--card-scale));
            transition: transform 0.2s ease;
        }
        .game-title {
            font-size: calc(28px * var(--font-scale));
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .game-subtitle {
            font-size: calc(14px * var(--font-scale));
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 28px;
        }
        .game-message {
            font-size: calc(18px * var(--font-scale));
            color: #00d9a5;
            font-weight: 600;
            min-height: 28px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }
        .game-message.error { color: #ff6b6b; }
        .game-message.success { color: #00d9a5; }
        .game-form {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .game-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-size: calc(16px * var(--font-scale));
            outline: none;
            transition: border 0.3s, background 0.3s;
        }
        .game-input::placeholder { color: rgba(255, 255, 255, 0.35); }
        .game-input:focus {
            border-color: #00d9a5;
            background: rgba(255, 255, 255, 0.1);
        }
        .game-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00d9a5, #00b894);
            color: #0f3460;
            font-size: calc(16px * var(--font-scale));
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 217, 165, 0.35);
        }
        .game-btn:active { transform: scale(0.96); }

        .theme-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: calc(38px * var(--font-scale));
            height: calc(38px * var(--font-scale));
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: calc(18px * var(--font-scale));
            line-height: 1;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .theme-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.18);
        }

        /* 左上角 AI 背景輸入框 */
        .ai-bg-panel {
            position: absolute;
            top: calc(14px * var(--font-scale));
            left: calc(14px * var(--font-scale));
            display: flex;
            gap: calc(4px * var(--font-scale));
            z-index: 10;
        }
        .ai-input {
            width: calc(110px * var(--font-scale));
            padding: calc(6px * var(--font-scale)) calc(8px * var(--font-scale));
            border-radius: calc(8px * var(--font-scale));
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: calc(12px * var(--font-scale));
            outline: none;
        }
        .ai-input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .ai-btn {
            padding: calc(6px * var(--font-scale)) calc(10px * var(--font-scale));
            border-radius: calc(8px * var(--font-scale));
            border: none;
            background: #00d9a5;
            color: #0f3460;
            font-size: calc(12px * var(--font-scale));
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .ai-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .test-hint {
            margin-top: 24px;
            font-size: calc(12px * var(--font-scale));
            color: rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
        }

        /* 銀行面板 */
        .bank-panel {
            background: rgba(26, 26, 46, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: calc(13px * var(--font-scale));
            color: #fff;
            text-align: left;
            margin-top: 16px;
        }
        .bank-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .bank-form {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        .bank-input {
            width: calc(64px * var(--font-scale));
            padding: calc(4px * var(--font-scale)) calc(6px * var(--font-scale));
            border-radius: calc(6px * var(--font-scale));
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: calc(12px * var(--font-scale));
        }
        .bank-btn {
            padding: calc(4px * var(--font-scale)) calc(8px * var(--font-scale));
            border-radius: calc(6px * var(--font-scale));
            border: none;
            background: #00d9a5;
            color: #0f3460;
            font-size: calc(12px * var(--font-scale));
            cursor: pointer;
        }

        /* 自定義控制面板 */
        .customizer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: calc(13px * var(--font-scale));
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .customizer label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .customizer input[type="range"] { flex: 1; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="game-card animate__animated animate__fadeIn">

        <!-- 左上角 AI 背景生成 -->
        <div class="ai-bg-panel">
            <input id="aiPrompt" type="text" placeholder="描述背景.AI生成" class="ai-input">
            <button id="aiGenBtn" class="ai-btn">生成</button>
        </div>

        <!-- 右上角主題切換 -->
        <button id="themeBtn" class="theme-btn" type="button" title="更換背景顏色" aria-label="更換背景顏色">🎨</button>

        <h1 class="game-title">猜數字遊戲</h1>
        <p class="game-subtitle">{{ subtitle }}</p>
        <p class="game-message animate__animated animate__fadeIn">{{ message }}</p>

        <form method="post" class="game-form">
            {% if target is none %}
                <input name="max_num" type="number" placeholder="輸入最大正整數" class="game-input">
                <button class="game-btn">開始</button>
            {% else %}
                <input name="guess" type="number" placeholder="猜一個1-{{ max_num }}的整數" class="game-input">
                <button class="game-btn">猜</button>
            {% endif %}
        </form>

        <p class="test-hint">{{ test_mode }}</p>

        <!-- 自定義控制 -->
        <div class="customizer">
            <label>卡片大小 <input type="range" id="cardScale" min="0.8" max="1.3" step="0.05" value="1"></label>
            <label>文字大小 <input type="range" id="fontScale" min="0.8" max="1.5" step="0.05" value="1"></label>
        </div>

        <!-- 銀行面板 -->
        <div class="bank-panel">
            <div class="bank-row">
                <span>💰 賭注</span>
                <strong>{{ bet }}</strong>
            </div>
            <div class="bank-row">
                <span>🏦 銀行</span>
                <strong>{{ bank }}</strong>
            </div>
            <form method="post" class="bank-form">
                <input name="bank_amount" type="number" placeholder="金額" class="bank-input">
                <button name="action" value="deposit" class="bank-btn">存入</button>
                <button name="action" value="withdraw" class="bank-btn">取出</button>
            </form>
        </div>
    </div>

    <script>
        // ===== 背景主題 =====
        const THEMES = [
            "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)",
            "linear-gradient(135deg, #12c2e9 0%, #c471ed 50%, #f64f59 100%)",
            "linear-gradient(135deg, #134e5e 0%, #71b280 100%)",
            "linear-gradient(135deg, #3a1c71 0%, #d76d77 50%, #ffaf7b 100%)",
            "linear-gradient(135deg, #141e30 0%, #243b55 100%)"
        ];
        const THEME_KEY = "guessNumBgTheme";
        const AI_BG_KEY = "guessNumAiBg";
        let themeIndex = 0;

        function applyTheme(index) {
            document.body.style.setProperty("--bg", THEMES[index]);
            document.body.style.backgroundImage = "";
            try {
                localStorage.setItem(THEME_KEY, String(index));
                localStorage.removeItem(AI_BG_KEY);
            } catch (e) {}
        }

        (function initTheme() {
            let saved = NaN;
            try { saved = parseInt(localStorage.getItem(THEME_KEY), 10); } catch (e) {}
            if (Number.isInteger(saved) && THEMES[saved]) themeIndex = saved;
            let savedAi = null;
            try { savedAi = localStorage.getItem(AI_BG_KEY); } catch (e) {}
            if (savedAi) {
                document.body.style.background = `url('${savedAi}') center/cover no-repeat`;
            } else {
                applyTheme(themeIndex);
            }
            document.getElementById("themeBtn").addEventListener("click", function () {
                themeIndex = (themeIndex + 1) % THEMES.length;
                applyTheme(themeIndex);
            });
        })();

        // ===== AI 背景生成（硅基流动 Kolors） =====
        const aiBtn = document.getElementById("aiGenBtn");
        const aiInput = document.getElementById("aiPrompt");
        const AI_GENERATING_KEY = "guessNumAiGenerating";
        const gameForm = document.querySelector(".game-form");
        const bankForm = document.querySelector(".bank-form");

        // 禁用/恢复所有游戏操作
        function setGameDisabled(disabled) {
            [gameForm, bankForm].forEach(form => {
                if (!form) return;
                form.querySelectorAll("input, button").forEach(el => el.disabled = disabled);
            });
        }

        // 页面加载时，检查是否正在生成（刷新后恢复按钮状态 + 禁用表单）
        (function initAiGenerating() {
            try {
                if (sessionStorage.getItem(AI_GENERATING_KEY) === "1") {
                    aiBtn.disabled = true;
                    aiBtn.textContent = "生成中…";
                    setGameDisabled(true);
                }
            } catch (e) {}
        })();

        aiBtn.addEventListener("click", async function () {
            const prompt = aiInput.value.trim();
            if (!prompt) {
                alert("請輸入背景描述");
                return;
            }

            aiBtn.disabled = true;
            aiBtn.textContent = "生成中…";
            setGameDisabled(true);
            try { sessionStorage.setItem(AI_GENERATING_KEY, "1"); } catch (e) {}

            try {
                const resp = await fetch("/generate_bg", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await resp.json();
                if (!resp.ok || data.error) {
                    throw new Error(data.error || "生成失敗");
                }

                document.body.style.background = `url('${data.url}') center/cover no-repeat`;
                try { localStorage.setItem(AI_BG_KEY, data.url); } catch (e) {}
            } catch (e) {
                alert("生成失敗：" + e.message);
            } finally {
                try { sessionStorage.removeItem(AI_GENERATING_KEY); } catch (e) {}
                aiBtn.disabled = false;
                aiBtn.textContent = "生成";
                setGameDisabled(false);
            }
        });

        // ===== 自定義（大小） =====
        const CUSTOM_KEY = "guessNumCustom";
        let customCfg = { cardScale: 1, fontScale: 1 };

        function applyCustom(cfg) {
            document.body.style.setProperty("--card-scale", cfg.cardScale);
            document.body.style.setProperty("--font-scale", cfg.fontScale);
        }

        (function initCustom() {
            try {
                const saved = JSON.parse(localStorage.getItem(CUSTOM_KEY));
                if (saved) customCfg = saved;
            } catch (e) {}

            document.getElementById("cardScale").value = customCfg.cardScale;
            document.getElementById("fontScale").value = customCfg.fontScale;
            applyCustom(customCfg);

            function save() { try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customCfg)); } catch (e) {} }

            document.getElementById("cardScale").addEventListener("input", e => {
                customCfg.cardScale = e.target.value; applyCustom(customCfg); save();
            });
            document.getElementById("fontScale").addEventListener("input", e => {
                customCfg.fontScale = e.target.value; applyCustom(customCfg); save();
            });
        })();
    </script>
</body>
</html>
