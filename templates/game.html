<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜數字遊戲</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg, linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%));
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game-card {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .game-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .game-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 28px;
        }
        .game-message {
            font-size: 18px;
            color: #00d9a5;
            font-weight: 600;
            min-height: 28px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }
        .game-message.error { color: #ff6b6b; }
        .game-message.success { color: #00d9a5; }
        .game-form {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .game-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s, background 0.3s;
        }
        .game-input::placeholder { color: rgba(255, 255, 255, 0.35); }
        .game-input:focus {
            border-color: #00d9a5;
            background: rgba(255, 255, 255, 0.1);
        }
        .game-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00d9a5, #00b894);
            color: #0f3460;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 217, 165, 0.35);
        }
        .game-btn:active { transform: scale(0.96); }
        .theme-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .theme-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.18);
        }
        .test-hint {
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="game-card animate__animated animate__fadeIn">
        <button id="themeBtn" class="theme-btn" type="button" title="更換背景顏色" aria-label="更換背景顏色">🎨</button>
        <h1 class="game-title">猜數字遊戲</h1>
        <p class="game-subtitle">{{ subtitle }}</p>
        <p class="game-message animate__animated animate__fadeIn">{{ message }}</p>
        <form method="post" class="game-form">
            {% if target is none %}
                <input name="max_num" type="number" placeholder="輸入最大正整數" class="game-input">
                <button class="game-btn">開始</button>
            {% else %}
                <input name="guess" type="number" placeholder="猜一個1-{{ max_num }}的整數" class="game-input">
                <button class="game-btn">猜</button>
            {% endif %}
        </form>
        <p class="test-hint">{{ test_mode }}</p>
    </div>
    <script>
        // 可選背景主題（依次循環切換）
        const THEMES = [
            "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)",
            "linear-gradient(135deg, #12c2e9 0%, #c471ed 50%, #f64f59 100%)",
            "linear-gradient(135deg, #134e5e 0%, #71b280 100%)",
            "linear-gradient(135deg, #3a1c71 0%, #d76d77 50%, #ffaf7b 100%)",
            "linear-gradient(135deg, #141e30 0%, #243b55 100%)"
        ];
        const STORAGE_KEY = "guessNumBgTheme";
        let themeIndex = 0;

        function applyTheme(index) {
            // --bg 由 body 的 background 使用，未設置時回退到默認漸變
            document.body.style.setProperty("--bg", THEMES[index]);
            try {
                localStorage.setItem(STORAGE_KEY, String(index));
            } catch (e) {
                // 隱私模式等情況下 localStorage 不可用，忽略即可
            }
        }

        (function initTheme() {
            let saved = NaN;
            try {
                saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
            } catch (e) {
                // 同上
            }
            if (Number.isInteger(saved) && THEMES[saved]) {
                themeIndex = saved;
            }
            applyTheme(themeIndex);

            document.getElementById("themeBtn").addEventListener("click", function () {
                themeIndex = (themeIndex + 1) % THEMES.length;
                applyTheme(themeIndex);
            });
        })();
    </script>
</body>
</html>
